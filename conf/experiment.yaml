# Pre-registered experiment configuration.
#
# Choices recorded here are made BEFORE seeing results, so that they cannot be
# tuned to produce a desired conclusion. Any change to this file after results
# exist must be recorded in OPEN_ISSUES.md with the reason.

seed: 20230288  # arbitrary fixed constant; digits from the ExaData Sci Data article number

# ---------------------------------------------------------------------------
# Data selection
# ---------------------------------------------------------------------------
months:
  # Chosen to span the observed instrumentation eras (see OI-2), not chosen
  # for their results.
  - "20-04"   # commissioning era: IPMI only
  - "20-11"   # 5 plugins, Ganglia sparse (67 metric partitions)
  - "21-08"   # all 9 plugins, Ganglia mature (99)
  - "22-06"   # all 9 plugins, Ganglia richest (355)

extraction:
  min_free_gb: 30        # abort rather than take the filesystem below this
  max_interim_gb: 60     # ceiling on data/interim at any moment

  # Selection rule, fixed before any predictability was measured.
  #
  # Sized against data/derived/inventory.parquet: the six "small" plugins cost
  # 3.4 GiB for the ENTIRE 31-month campaign, so there is no reason to sample
  # them at all — they are taken whole. Only IPMI (114 GiB) and Ganglia
  # (282 GiB) need month sampling, and they get every metric in the sampled
  # months rather than a metric subset, so no metric is chosen by its
  # behaviour.
  select:
    all_months:
      - weather
      - vertiv
      - logics
      - schneider
      - nagios
      - slurm
      - job_table     # covariate only, see OI-8
    sampled_months:
      - ipmi
      - ganglia

arms:
  native:      # native-cadence data extracted from the monthly archives
    enabled: true
  aggregated:  # the 15-minute pre-aggregated per-node IPMI set, all 31 months
    enabled: true
    step_minutes: 15

# ---------------------------------------------------------------------------
# Fixed entity panel
#
# The extracted partitions hold ~55 billion rows, and node-level series of the
# same metric are highly redundant — nodes share racks, inlet air, cooling
# zones, and workload, which is also why they are not independent samples
# (OI-9). Analysis therefore runs on a fixed panel of entities.
#
# Membership is a stable hash of the entity label under the seed above, so the
# panel is identical on every re-run and, critically, identical across every
# metric and month: node 142 is either in the panel everywhere or nowhere.
# Cross-metric comparisons are then made on the same physical machines.
#
# Plugins with fewer entities than the cap — Vertiv's 25 devices, Schneider's
# two panels, Weather's single facility series — are taken whole.
# ---------------------------------------------------------------------------
panel:
  max_entities: 96   # of ~980 nodes; small plugins are unaffected

# ---------------------------------------------------------------------------
# Series sampling
#
# The census covers far more series than can be forecast — a single Ganglia
# partition alone holds nearly a thousand nodes. The sweep therefore runs on a
# stratified sample, drawn with the seed above so it is exactly reproducible.
#
# Strata are (plugin, origin, value_kind): the axes the study's hypothesis is
# about. Sampling within a stratum is uniform at random, never by any property
# related to predictability.
# ---------------------------------------------------------------------------
sampling:
  per_stratum: 40
  eligibility:
    min_samples: 2000        # enough for 20 origins at a 96-step horizon
    min_coverage: 0.5        # at least half the expected samples present
    exclude_constant: true   # MASE is undefined; counted and reported, not hidden
  # Constant and near-constant series are a finding in their own right and are
  # reported as a share of the census, not silently dropped.

# ---------------------------------------------------------------------------
# Predictability measures (Phase 3) — computed with no forecaster involved
# ---------------------------------------------------------------------------
features:
  min_length: 512           # series shorter than this are excluded, and counted
  permutation_entropy:
    order: 5
    delay: 1
  sample_entropy:
    m: 2
    r_times_sd: 0.2
  dfa:
    min_scale: 8
    max_scale_fraction: 0.25
  changepoints:
    model: "rbf"
    penalty: "bic"
  stl:
    robust: true

# ---------------------------------------------------------------------------
# Forecast protocol (Phase 4)
# ---------------------------------------------------------------------------
forecast:
  # Horizons in steps. On the aggregated arm one step is 15 minutes, so these
  # are 15 min, 1 h, 3 h, and 24 h.
  horizons: [1, 4, 12, 96]
  rolling_origin:
    n_origins: 20
    min_train_fraction: 0.5
    gap: 0                  # no gap; the harness asserts strict causality itself
  metric: "MASE"
  # Seasonal period for the MASE denominator, fixed a priori per family (OI-5).
  # 96 = one day at 15-minute steps. Robustness check at m=1 is always also run.
  seasonal_period_default: 96
  seasonal_period_robustness: [1]

  tiers:
    naive:       ["persistence", "seasonal_naive", "drift"]
    statistical: ["arima", "ets", "theta"]
    ml:          ["lightgbm"]
    dl:          ["tcn", "nbeats", "patchtst"]

# ---------------------------------------------------------------------------
# Linking analysis (Phase 5)
# ---------------------------------------------------------------------------
link:
  # Cross-validation is grouped by signal family, so the relation must
  # generalise to families it has never seen. This is the honest test.
  cv:
    scheme: "leave-one-family-out"
  cluster_robust_by: ["rack", "metric"]   # see OI-9
