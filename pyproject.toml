[project]
name = "hpc-signal-forecastability"
version = "0.1.0"
description = "Why are HPC monitoring signals hard to forecast? A predictability study on M100 ExaData."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mohsen Seyedkazemi Ardebili", email = "mohsen.seyedkazemi@gmail.com" },
]
keywords = [
    "high-performance computing",
    "time series",
    "predictability",
    "forecasting",
    "datacenter telemetry",
    "Marconi100",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Tier 3 of the forecast suite.
ml = ["lightgbm>=4.1"]
# Tier 4 — CPU-sized neural forecasters.
dl = ["torch>=2.2"]
# Changepoint detection for the non-stationarity measures.
cpd = ["ruptures>=1.1.9"]
# Literature harvest (Phase 6).
lit = ["requests>=2.31"]
# Figures.
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
